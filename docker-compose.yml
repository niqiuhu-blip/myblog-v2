version: '3.8'

services:
  postgres:
    image: ${POSTGRES_IMAGE:-ccr.ccs.tencentyun.com/your-namespace/postgres:16-alpine}
    container_name: myblog-postgres
    environment:
      POSTGRES_USER: myblog
      POSTGRES_PASSWORD: myblog_dev_password
      POSTGRES_DB: myblog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myblog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
